<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV — Jintong Yang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --text: #1a1a1a;
            --text-muted: #888;
            --bg: #fafaf7;
            --accent: #d9410e;
            --border: #e8e6e0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.55;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶部导航条 ===== */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav-left {
            display: flex;
            align-items: baseline;
            gap: 16px;
        }

        .nav-name {
            font-family: 'Instrument Serif', serif;
            font-size: 22px;
        }

        .nav-name .italic { font-style: italic; }

        .nav-divider {
            color: var(--text-muted);
            font-family: 'Instrument Serif', serif;
            font-style: italic;
        }

        .nav-page {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: 18px;
            color: var(--text-muted);
        }

        .nav-right {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-right a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            position: relative;
        }

        .nav-right a::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0;
            width: 100%; height: 1px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .nav-right a:hover::after { transform: scaleX(1); }

        .nav-right .arrow { margin-left: 4px; font-size: 12px; }

        .back-link {
            color: var(--text-muted) !important;
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: 16px;
        }

        .back-link::after { background: var(--text-muted) !important; }

        /* ===== 主内容 ===== */
        .content {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 48px 60px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 48px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .header h1 .italic { font-style: italic; }

        .header .subtitle {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            background: var(--text);
            color: var(--bg);
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: var(--accent);
        }

        .download-btn .arrow { margin-left: 8px; }

        /* PDF 嵌入区 */
        .pdf-container {
            background: white;
            border: 1px solid var(--border);
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            overflow: hidden;
        }

        .pdf-container embed,
        .pdf-container iframe {
            display: block;
            width: 100%;
            height: 90vh;
            border: none;
        }

        /* fallback 提示（如果 PDF 不能嵌入） */
        .pdf-fallback {
            padding: 60px 40px;
            text-align: center;
            color: var(--text-muted);
        }

        .pdf-fallback a {
            color: var(--accent);
            font-weight: 500;
            text-decoration: none;
        }

        /* ===== Footer ===== */
        .footer {
            padding: 24px 48px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: 14px;
            color: var(--text-muted);
        }

        @media (max-width: 700px) {
            .nav { padding: 20px 24px; flex-direction: column; gap: 12px; align-items: flex-start; }
            .content { padding: 32px 24px 48px; }
            .header h1 { font-size: 36px; }
            .footer { padding: 20px 24px; flex-direction: column; gap: 8px; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <nav class="nav">
        <div class="nav-left">
            <span class="nav-name">Jintong <span class="italic">Yang</span></span>
            <span class="nav-divider">/</span>
            <span class="nav-page">Curriculum Vitae</span>
        </div>
        <div class="nav-right">
            <a href="index.html" class="back-link">← Back to work</a>
            <a href="cv.pdf" download>Download PDF<span class="arrow">↓</span></a>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="content">

        <div class="header">
            <h1>Curriculum <span class="italic">Vitae</span></h1>
            <div class="subtitle">Updated May 2026</div>
            <a href="cv.pdf" download class="download-btn">
                Download as PDF<span class="arrow">↓</span>
            </a>
        </div>

        <!-- PDF 嵌入区 -->
        <div class="pdf-container">
            <!-- 这里 cv.pdf 就是你的 CV 文件，跟 index.html 放同一文件夹 -->
            <embed src="cv.pdf" type="application/pdf" />
            <!-- 备用：如果浏览器不支持 embed，会显示这段
            <div class="pdf-fallback">
                <p>Your browser doesn't support inline PDFs.<br><a href="cv.pdf" download>Click here to download my CV</a>.</p>
            </div>
            -->
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>© 2025 Jintong Yang</span>
        <span>jintongyang@ucsb.edu</span>
    </footer>

</body>
</html>
