<head>

<title>Light Room · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: rgba(238, 234, 228, 0.86);
    --ink-soft: rgba(238, 234, 228, 0.5);
    --serif: "Cormorant Garamond", "Songti SC", serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2c2e33; color: var(--ink); }
  body { height: 100vh; overflow: hidden; overscroll-behavior: none; font-family: var(--serif); overflow-x: hidden; }
  canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  canvas#txt { position: fixed; left: 0; top: 0; z-index: 1; pointer-events: none; mix-blend-mode: screen; opacity: 0.7; transition: opacity .45s ease;
    -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); }
  .ui { position: fixed; z-index: 2; pointer-events: none; }
  .ui a, .ui button { pointer-events: auto; }
  .name { top: 26px; left: 32px; font-size: 34px; font-weight: 500; font-weight: 300; letter-spacing: 0.02em; }
  .name small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--ink-soft); margin-top: 6px; text-transform: uppercase; }
  .name a { color: rgba(255, 252, 246, 0.95); text-decoration: none; display: block; cursor: pointer;
    text-shadow: 0 1px 14px rgba(0,0,0,0.28); transition: color .35s, text-shadow .35s; }
  .name a small { font-weight: 500; color: rgba(255, 250, 242, 0.75); transition: color .35s; }
  .name a:hover { color: #fff; text-shadow: 0 0 18px rgba(255, 244, 225, 0.9), 0 0 2px rgba(255,255,255,0.8); }
  .name a:hover small { color: rgba(255, 252, 246, 0.98); }
  nav.ui { top: 30px; right: 32px; display: flex; gap: 32px; font-family: var(--mono); font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; }
  nav a { color: inherit; text-decoration: none; opacity: 0.7; transition: opacity .3s; }
  nav a:hover { opacity: 1; }
  .work { right: 32px; bottom: 30px; text-align: right; }
  .work .title { font-size: 26px; font-weight: 300; font-style: italic; }
  .work .meta { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--ink-soft); text-transform: uppercase; margin-top: 6px; }
  .rail { left: 34px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 18px; }
  .rail button { width: 6px; height: 6px; border-radius: 50%; border: 1px solid currentColor; background: transparent; opacity: .5; cursor: pointer; transition: all .5s; color: inherit; }
  .rail button.on { background: currentColor; opacity: 1; transform: scale(1.5); }

  .veil {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(22, 22, 28, 0.35); backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
    opacity: 0; pointer-events: none; transition: opacity .9s ease;
  }
  .veil.open { opacity: 1; pointer-events: auto; }
  .panel { width: min(920px, 90vw); display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center;
    transform: translateY(18px) scale(.985); transition: transform 1.1s cubic-bezier(.2,.7,.1,1); }
  .veil.open .panel { transform: none; }
  .panel img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; border-radius: 2px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); }
  .panel h2 { font-weight: 300; font-size: 44px; font-style: italic; line-height: 1.05; }
  .panel .m { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); margin: 14px 0 22px; }
  .panel p { font-size: 18px; line-height: 1.5; }
  .close { position: absolute; top: 28px; right: 32px; background: none; border: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); cursor: pointer; }
  @media (max-width: 720px) {
    .panel { grid-template-columns: 1fr; gap: 20px; }
    .panel h2 { font-size: 32px; }
    nav.ui { gap: 14px; }
    .rail { display: none; }
  }
</style>
</head>

  const x = t.getContext("2d");
  if (loadedImgs[i]) { x.drawImage(loadedImgs[i], 0, 0, TILE, TILE); return t; }
  const grd = x.createLinearGradient(0, 0, TILE * 0.3, TILE);
  grd.addColorStop(0, w.base[1]); grd.addColorStop(1, w.base[0]);
  x.fillStyle = grd; x.fillRect(0, 0, TILE, TILE);
  // soft highlight
  const rg = x.createRadialGradient(TILE * (0.3 + i * 0.1), TILE * 0.45, 10, TILE * 0.4, TILE * 0.5, TILE * 0.6);
  rg.addColorStop(0, "rgba(255,255,255,0.35)"); rg.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = rg; x.fillRect(0, 0, TILE, TILE);
  // color bar strips (top + thin bottom) so the smears carry color
  const bw = TILE / BARS.length;
  BARS.forEach((c, k) => {
    x.fillStyle = c; x.globalAlpha = 0.8;
    x.fillRect(k * bw, 0, bw, 46);
    x.fillStyle = BARS[(k + i + 2) % BARS.length]; x.globalAlpha = 0.6;
    x.fillRect(((k + i) % BARS.length) * bw, TILE - 14, bw, 14);
  });
  x.globalAlpha = 1;
  // empty-frame marks
  x.strokeStyle = "rgba(255,255,255,0.55)"; x.lineWidth = 1.5;
  x.strokeRect(22, 66, TILE - 44, TILE - 102);
  x.strokeStyle = "rgba(255,255,255,0.22)";
  x.beginPath(); x.moveTo(22, 66); x.lineTo(TILE - 22, TILE - 36); x.moveTo(TILE - 22, 66); x.lineTo(22, TILE - 36); x.stroke();
  x.fillStyle = "rgba(255,255,255,0.92)";
  x.textAlign = "center";
  x.font = "300 76px 'Cormorant Garamond', serif";
  x.fillText("WORK " + String(i + 1).padStart(2, "0"), TILE / 2, TILE / 2 + 18);
  x.font = "400 17px 'JetBrains Mono', monospace";
  x.fillStyle = "rgba(255,255,255,0.7)";
  x.fillText("image / video here", TILE / 2, TILE / 2 + 56);
  return t;
}

// ---------- GL ----------
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", { antialias: false });

const VS = `attribute vec2 a; varying vec2 vUv; void main(){ vUv = a*0.5+0.5; gl_Position = vec4(a,0.,1.); }`;
const FS = `
precision highp float;
varying vec2 vUv;
uniform vec2 uRes;
uniform float uTime, uT, uAspect, uHover, uN;
uniform vec2 uMouse;
uniform sampler2D uAtlas, uText, uMenu;
uniform float uTextA;
uniform vec4 uClicks[4];
uniform float uHoverPanel, uRot;
uniform vec2 uC; uniform float uK; uniform vec2 uWH;

const float HY = -0.27;
const float PI = 3.14159265;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }
vec3 key4(float t, vec3 a, vec3 b, vec3 c, vec3 d){
  t = clamp(t,0.,1.)*3.;
  if(t<1.) return mix(a,b,smoothstep(0.,1.,t));
  if(t<2.) return mix(b,c,smoothstep(1.,2.,t));
  return mix(c,d,smoothstep(2.,3.,t));
}
vec3 spectrum(float x){ return clamp(0.5+0.5*cos(6.2831*(x+vec3(0.0,0.33,0.67))),0.,1.); }

vec3 sunCol(){ return key4(uT, vec3(.84,.84,1.0), vec3(1.0,.86,.74), vec3(1.0,.72,.6), vec3(.86,.72,1.0)); }
vec3 ambCol(){ return key4(uT, vec3(.26,.29,.38), vec3(.44,.40,.39), vec3(.40,.34,.36), vec3(.22,.20,.31)); }
float sunI(){ return key4(uT, vec3(1.0), vec3(1.35), vec3(1.3), vec3(1.0)).x; }

float windowMask(vec2 q, float blur, out vec2 luv){
  vec2 d = q - uC;
  d.x -= uK * d.y;
  luv = d/uWH + 0.5;
  d += (vec2(fbm(q*2.2+uTime*0.04), fbm(q*2.2-uTime*0.03)) - 0.5) * 0.03;   // edges breathe a little
  vec2 hs = uWH*0.5;
  // rounded rectangle with a soft, eased falloff, so the edge has no straight hard sides
  float rr = 0.06;
  vec2 dd = abs(d) - hs + rr;
  float sd = length(max(dd, 0.)) + min(max(dd.x, dd.y), 0.) - rr;
  float m = 1. - smoothstep(-blur*1.1, blur*1.3, sd);
  m = m*m*(3. - 2.*m);
  float bar = 0.006;
  m *= smoothstep(bar-blur*.5, bar+blur*.5, abs(d.x));
  m *= smoothstep(bar-blur*.5, bar+blur*.5, abs(d.y - uWH.y*0.17));
  float cover = 1.-smoothstep(-0.04, 0.03, d.x + 0.03*sin(uTime*0.35 + d.y*4.));
  float folds = 0.82 + 0.18*pow(sin(d.x*40. + 2.2*sin(d.y*3.+uTime*0.4)), 2.);
  m *= mix(1.0, folds*0.8, cover*0.6);
  m *= 0.85 + 0.15*smoothstep(0.35, 0.7, fbm(q*5.0 + vec2(uTime*0.03, 0.)));
  return m;
}
float windowMaskCheap(vec2 q, float blur){
  vec2 d = q - uC; d.x -= uK*d.y;
  vec2 hs = uWH*0.5;
  return (1.-smoothstep(hs.x-blur, hs.x+blur, abs(d.x))) * (1.-smoothstep(hs.y-blur, hs.y+blur, abs(d.y)));
}

vec3 tile(float i, vec2 luv){
  luv = clamp(luv, 0.003, 0.997);
  return texture2D(uAtlas, vec2((i + luv.x)/uN, luv.y)).rgb;
}
vec3 workTex(vec2 luv){
  float f = uT*(uN-1.);
  float i0 = floor(f); float i1 = min(i0+1., uN-1.);
  float m = smoothstep(0.3, 0.7, fract(f));
  return mix(tile(i0, luv), tile(i1, luv), m);
}
// slow, sorted-pixel displacement inside the image
vec2 sortUV(vec2 luv){
  float cid = floor(luv.x*64.); float hc = hash(vec2(cid,1.7));
  float drift = 0.5 + 0.5*sin(uTime*0.15 + hc*30.);
  luv.y += step(0.93, hc) * (hash(vec2(cid,2.3)) - 0.5) * 0.08 * drift;
  return luv;
}
// soft bleed of the image past the light's edge
vec3 streaks(vec2 luv){
  vec3 s = vec3(0.);
  if(luv.x > 0.02 && luv.x < 0.98){
    float n = noise(vec2(luv.x*38., 1.3)) * noise(vec2(luv.x*9., 7.1));
    float len = (0.02 + pow(n, 2.2)*0.9) * (0.85 + 0.15*sin(uTime*0.2 + luv.x*20.));
    float up = luv.y - 1.; float dn = -luv.y;
    if(up > 0.){
      vec3 c = (workTex(vec2(luv.x-0.008, 0.95)) + workTex(vec2(luv.x, 0.95)) + workTex(vec2(luv.x+0.008, 0.95))) / 3.;
      s += c * exp(-up/len*2.5);
    }
    if(dn > 0.){
      vec3 c = (workTex(vec2(luv.x-0.008, 0.05)) + workTex(vec2(luv.x+0.008, 0.05))) * 0.5;
      s += c * exp(-dn/(len*0.5)*2.5) * 0.8;
    }
  }
  return s;
}

vec2 srcC(){ return vec2(0.2*min(uAspect,1.7), 0.); }

// where the window light passes through the glass and splits (a point on the glass panel)
// centre of the transparent sculpture on screen
vec2 sculptC(){ return vec2(0.58*uAspect*0.5, -0.03); }
// the light splits where it passes through the turning screens: this point orbits with the sculpture
vec2 glassPt(){ return vec2(0.58*uAspect*0.5, -0.14) + vec2(0.3*0.62*sin(uRot*1.0 + 0.6), 0.1 + 0.03*sin(uRot*0.5)); }
// a fan of spectrum leaving o in direction ang
vec3 beam(vec2 p, vec2 o, float ang, float spread, float len){
  vec2 dir = vec2(cos(ang), sin(ang));
  vec2 rel = p - o;
  float v = dot(rel, dir);
  float u = dot(rel, vec2(dir.y, -dir.x)) / (0.006 + v*spread);
  float band = smoothstep(1.15, 0.2, abs(u)) * smoothstep(0.0, 0.06, v) * (1.0 - smoothstep(len*0.25, len, v));
  // broken into soft gaps, as if the light came through between the screens
  float gaps = smoothstep(0.35, 0.65, fbm(vec2(v*7.0 - uRot*0.6, u*0.6 + 3.0)));
  vec3 c = mix(vec3(1.0, 0.96, 0.9), spectrum(u*0.45 + 0.5), 0.6);   // softer, less saturated
  return c * band * (0.25 + 0.75*gaps);
}
vec3 rainbow(vec2 p){
  float mx = 0.6*sin(uRot*0.8) + 0.15*sin(uTime*0.06);   // swings as the sculpture turns
  vec2 o = glassPt();
  float strength = (0.45 + 0.55*sin(uT*PI)) * 0.95;
  float shimmer = 0.85 + 0.15*sin(p.y*90. + uTime*0.6 + fbm(p*8.)*4.);
  vec3 col = vec3(0.);
  // beam 1: thrown back onto the wall beside the glass; the mouse swings it up and down
  vec3 b1 = beam(p, o, 2.95 + mx*0.42, 0.13, 0.6);
  col += b1 * (p.y > HY ? 0.32 : 0.0);
  // beam 2: falls from the glass onto the water; faint in the air, bright where it lands
  vec3 b2 = beam(p, o, -2.05 + mx*0.5, 0.18, 0.7);
  col += b2 * (p.y > HY ? 0.04 : 0.36);
  return col * shimmer * strength;
}

// light the glass throws back onto the wall: scattered blurry shards with rainbow edges
vec3 glassFlecks(vec2 p){
  if(p.y < HY + 0.01) return vec3(0.);
  float hx = uAspect*0.5;
  float dx = sculptC().x - 0.13 - p.x;
  if(dx < 0.0 || dx > 0.65) return vec3(0.);
  vec2 cellSz = vec2(0.1, 0.13);
  vec2 g = (p + vec2(uRot*0.18, 0.0)) / cellSz;         // shards slide as the sculpture turns
  vec2 c = floor(g);
  float h = hash(c + 4.2);
  if(h < 0.6) return vec3(0.);
  vec2 q = fract(g) - 0.5 - (vec2(hash(c + 1.1), hash(c + 2.2)) - 0.5)*0.4;
  float a = (hash(c + 3.3) - 0.5)*0.6;
  q = mat2(cos(a), -sin(a), sin(a), cos(a)) * q;
  vec2 sz = vec2(0.09 + 0.16*hash(c + 5.5), 0.2 + 0.25*hash(c + 6.6));
  float m = (1. - smoothstep(sz.x*0.15, sz.x, abs(q.x))) * (1. - smoothstep(sz.y*0.3, sz.y, abs(q.y)));
  vec3 tint = mix(vec3(1.0), spectrum(q.x/sz.x*0.5 + 0.5 + h*0.3)*1.3, 0.65);
  float fade = exp(-dx*3.2) * smoothstep(0.0, 0.03, dx);
  float tw = 0.7 + 0.3*sin(uTime*0.7 + h*40.);
  return sunCol() * tint * m * fade * tw * 0.5 * sunI() * (0.35 + 0.65*sin(uT*PI));
}

// hand-troweled plaster: height field
float plasterH(vec2 q){
  vec2 r = mat2(0.94, 0.34, -0.34, 0.94) * q;
  float warp = fbm(q*1.7);
  float strokes = fbm(r*vec2(2.6, 8.0) + warp*1.6);
  float blotch = fbm(q*5.0 + 3.7);
  float pits = smoothstep(0.82, 0.95, noise(q*70. + 11.));
  return strokes*0.6 + blotch*0.35 - pits*0.06;
}
vec2 plaster(vec2 q){ // x: albedo factor, y: relief shading under raking light
  float h = plasterH(q);
  float e = 0.006;
  vec2 grad = vec2(plasterH(q + vec2(e,0.)) - h, plasterH(q + vec2(0.,e)) - h) / e;
  vec2 L = normalize(vec2(-uK*1.2 - 0.3, 0.9));
  float relief = clamp(dot(grad, L) * 0.006, -0.3, 0.3);
  float grain = (noise(q*160.) - 0.5) * 0.05;
  return vec2(0.9 + 0.16*h + grain, relief);
}

float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }

// the wall is a smooth curved surface (mostly vertical folds)
float waveH(vec2 q){
  return 0.6*sin(q.x*3.2 + q.y*0.6) + 0.3*sin(q.x*7.1 - q.y*1.5 + 1.0) + 0.12*sin(q.x*13.0 + q.y*3.0 + 2.0);
}
vec2 waveN(vec2 q){
  return vec2(0.6*3.2*cos(q.x*3.2 + q.y*0.6) + 0.3*7.1*cos(q.x*7.1 - q.y*1.5 + 1.0) + 0.12*13.0*cos(q.x*13.0 + q.y*3.0 + 2.0),
              0.6*0.6*cos(q.x*3.2 + q.y*0.6) - 0.3*1.5*cos(q.x*7.1 - q.y*1.5 + 1.0) + 0.12*3.0*cos(q.x*13.0 + q.y*3.0 + 2.0)) * 0.12;
}
// in a few patches the surface breaks into a mosaic of square blocks of different sizes and depths.
// returns xy: point to shade (block centre, or p itself where the wall is smooth), z: depth, w: local coord packed
vec4 mosaic(vec2 p, out vec2 l, out float isM){
  float region = smoothstep(0.44, 0.64, fbm(p*1.25 + vec2(7.0, 2.0)));
  isM = 0.0; l = vec2(0.5);
  if(region <= 0.0) return vec4(p, 0.0, 0.0);
  float sz = 0.072;
  vec2 c = floor(p/sz);
  for(int k=0;k<3;k++){
    // smaller blocks toward the patch's edge
    float split = hash(c + sz*31.);
    if(split < 0.55 - region*0.45) { sz *= 0.5; c = floor(p/sz); }
  }
  float h = hash(c*1.13 + sz*17.);
  if(h > region*1.15) return vec4(p, 0.0, 0.0);
  isM = 1.0;
  l = fract(p/sz);
  return vec4((c + 0.5)*sz, (0.25 + 0.75*hash(c + 5.5)) * region, sz);
}
vec2 wallShift(vec2 n, float d){ return vec2(n.x*0.06, 0.0) + vec2(-uK*0.6 - 0.25, 0.45)*d*0.03; }

vec3 wallCol(vec2 p, bool full, bool refl){
  vec3 amb = ambCol(), sc = sunCol(); float si = sunI();
  vec3 col;
  if(refl){
    vec2 luv;
    col = amb * mix(1.0, 0.62, smoothstep(0.0, 0.5, p.y));
    float m = windowMask(p, 0.07, luv);
    float inside = smoothstep(0.0, 0.06, min(min(luv.x, 1.-luv.x), min(luv.y, 1.-luv.y)));
    vec3 texC = pow(workTex(luv), vec3(1.25)) * 1.45;
    col *= 1.0 - 0.55*inside*m;
    col += sc * m * mix(vec3(1.0), texC, 0.97*inside) * si * mix(1.0, 0.72, inside);
    return col;
  }

    col = amb * mix(1.0, 0.62, smoothstep(0.0, 0.5, p.y));
    vec2 pl = plaster(p);
    col *= pl.x * (1.0 + pl.y*0.35);
    vec2 luv;
    vec2 cav = normalize(p - uC + 1e-4) * 0.005;                     // colour fringe spreads outward evenly
    vec3 m3 = vec3(windowMask(p - cav, 0.065, luv), windowMask(p + cav, 0.065, luv), 0.);
    m3 = vec3(m3.x, windowMask(p, 0.065, luv), m3.y);
    float e = min(min(luv.x, 1.-luv.x), min(luv.y, 1.-luv.y));
    float inside = smoothstep(-0.02, 0.09, e);
    vec3 tex = workTex(luv);
    vec3 texC = pow(tex, vec3(1.25)) * 1.45;
    vec3 lit = mix(vec3(1.0), texC, 0.97*inside) * (1.0 + 0.25*uHover);
    col *= 1.0 - 0.55*inside*m3.g;
    col += sc * m3 * lit * si * mix(0.8, 0.72, inside) * (pl.x*0.9 + 0.1) * (1.0 + pl.y*1.6*(1.0 - 0.75*inside));
    if(full){
      col += sc * streaks(luv) * si * 0.2;
    }
    col *= 1.0 - 0.25*exp(-(p.y-HY)*40.);
  return col;
}

vec3 scene(vec2 p, bool full){
  if(p.y > HY) return wallCol(p, full, false);
  vec3 amb = ambCol(), sc = sunCol(); float si = sunI();
  float depth = HY - p.y;
  float z = 1.0 / (depth + 0.03);
  vec2 wp = vec2(p.x*z*0.6, z*0.9);
  float w1 = z*1.5 - uTime*1.1 + sin(p.x*z*0.45 + uTime*0.2)*1.4;
  float w2 = p.x*z*1.0 + z*0.6 - uTime*0.75;
  vec2 rip = vec2(cos(w2)*0.5 + (fbm(wp*0.7 + uTime*0.1)-0.5)*0.8,
                  cos(w1)*0.9 + cos(w2)*0.3 + (fbm(wp*0.6 + 4.1 - uTime*0.08)-0.5)*0.8);
  rip *= vec2(0.014, 0.022) * (0.35 + depth*2.6);
  vec2 rq = vec2(p.x, HY + depth*1.9) + rip;          // reflection pulled up toward the waterline
  rq.y = max(rq.y, HY + 0.001);
  vec3 refl = wallCol(rq, false, true);
  float fres = 0.4 + 0.45*exp(-depth*4.0);
  vec3 water = amb * vec3(0.55, 0.62, 0.68) * (0.7 - depth*0.4);
  vec3 col = mix(water, refl*0.95, fres);
  float bright = lum(refl);
  if(full){
    vec2 gq = vec2(p.x*z*2.2, z*3.0) + vec2(uTime*0.25, uTime*0.4);
    float gl = pow(noise(gq*6.0), 16.0) + pow(noise(gq*9.3 + 7.), 20.);
    col += sc * gl * smoothstep(0.3, 0.9, bright) * 2.2 * si;
  }
  // crest highlights so the ripples read clearly
  float crest = pow(max(0., sin(w1 + 0.6)), 10.) * 0.7 + pow(max(0., sin(w2*1.3)), 14.) * 0.4;
  col += sc * crest * (0.015 + 0.22*bright) * si * smoothstep(0.0, 0.05, depth);
  col *= 0.97 + 0.06*cos(w1);
  return col;
}

// ---------- fluted (reeded) glass panels ----------
// one large upright reeded glass panel standing in the water, perpendicular to the wall.
// inner edge (s=0) touches the wall; outer edge (s=1) is nearer to us, so it reaches lower and higher on screen.
// xi, xo: inner / outer x (in half-screen widths); bi, bo: bottom y; ti, to: top y
vec3 glassPanel(vec2 p, vec3 col, float xi, float xo, float bo, float ti, float to, float F, float k, bool reflection){
  float hx = uAspect*0.5;
  float x0 = xi*hx, x1 = xo*hx;
  float s = (p.x - x0) / (x1 - x0);
  float yb = mix(HY, bo, s), yt = mix(ti, to, s);
  float aa = 0.003 / (x1 - x0);
  float inS = smoothstep(-aa, aa, s) * (1. - smoothstep(1. - aa, 1. + aa, s));
  float py = p.y;
  if(reflection){ if(py > yb) return col; py = 2.0*yb - py; }
  float inY = smoothstep(yb - 0.002, yb + 0.002, py) * (1. - smoothstep(yt - 0.002, yt + 0.002, py));
  float inside = inS * inY;
  if(inside <= 0.0) return col;
  vec3 sc = sunCol(); float si = sunI();
  float v = (py - yb) / (yt - yb);
  // perspective: ribs crowd together near the wall, open up toward us
  float a = 2.4;
  float t = a*s / (1.0 + (a - 1.0)*s);                 // dense against the wall, opening up toward us
  float f = fract(t*F);
  float ribW = (x1 - x0) / F * pow(1.0 + (a - 1.0)*s, 2.0) / a;
  float ed = min(min(s, 1. - s)*(x1 - x0), min(py - yb, yt - py));
  float edge = exp(-pow(ed/0.004, 2.));
  if(reflection){
    float fade = exp(-(yb - p.y)*6.0);
    return col + (sc*0.7 + spectrum(s + v)*0.2) * si * edge * 0.14 * inside * fade
               + sc * si * 0.03 * inside * fade * (0.5 + 0.5*cos(f*6.2831));
  }
  // ---- each rib is a raised half-cylinder: n is the surface slope across it
  float n = (f - 0.5)*2.0;
  float hcyl = sqrt(max(0.0, 1.0 - n*n));
  // refraction through a thick convex rib: the view behind is compressed and flipped inside every rib
  vec2 o = vec2(-n * k * ribW * 14.0, 0.);
  vec3 refr;
  refr.r = scene(p + o*0.97, true).r + rainbow(p + o*0.97).r;
  refr.g = scene(p + o, true).g + rainbow(p + o).g;
  refr.b = scene(p + o*1.04, true).b + rainbow(p + o*1.04).b;
  float L = lum(refr);
  // thick glass is faintly green-grey and loses a little light
  vec3 g = refr * vec3(0.93, 0.975, 0.965);
  // light comes from the window side (left); the lit flank of each rib is brighter, the far flank darker
  float lightSide = -0.55;
  float lambert = clamp(dot(normalize(vec2(n, hcyl)), normalize(vec2(lightSide, 0.85))), 0.0, 1.0);
  g *= 0.6 + 0.55*lambert;
  // Fresnel: toward the steep edges of a rib the glass reflects instead of transmits
  float fres = 0.04 + 0.96*pow(1.0 - hcyl, 5.0);
  vec3 env = mix(ambCol()*0.55, sc*0.9*si, smoothstep(-0.2, 0.8, -n*0.7 + v*0.4));
  g = mix(g, env, clamp(fres*0.85, 0.0, 0.85));
  // a sharp highlight running down each rib, broken up a little along its length
  float spec = exp(-pow((n + 0.42)/0.07, 2.0));
  float along = 0.65 + 0.35*fbm(vec2(floor(t*F)*1.7, v*6.0));
  g += sc * si * spec * along * (0.22 + 0.25*L);
  // only where the highlight is brightest does a little colour split off
  g += spectrum(n*2.0 + 0.5) * exp(-pow((n + 0.25)/0.12, 2.0)) * smoothstep(0.55, 0.9, L) * si * 0.06;
  g += sc * si * exp(-pow((py - yb)/0.0025, 2.)) * 0.16;                 // waterline

  // ---- thickness
  // top edge is scalloped by the ribs (the profile of the glass), with a lit rim
  float bump = hcyl * 0.006;
  float topLine = yt - 0.004 + bump;
  float rimBand = smoothstep(topLine - 0.014, topLine - 0.004, py) * (1.0 - smoothstep(topLine - 0.001, topLine + 0.001, py));
  vec3 rimC = mix(refr, sc*si, 0.35) * vec3(0.78, 0.95, 0.9) + sc*si*0.12*hcyl;
  g = mix(g, rimC, rimBand);
  g += sc * si * exp(-pow((py - topLine)/0.0012, 2.0)) * (0.35 + 0.4*hcyl);
  // side face on the outer edge: the slab seen edge-on, green where the glass is thickest
  float thick = 0.024 / (x1 - x0);
  float fs = (s - (1.0 - thick)) / thick;
  if(fs > 0.0){
    vec2 o2 = vec2((fs - 0.5)*0.08, 0.0);
    vec3 thru = vec3(scene(p + o2*0.95, true).r, scene(p + o2, true).g, scene(p + o2*1.05, true).b);
    vec3 side = thru * vec3(0.62, 0.86, 0.8) + vec3(0.02, 0.06, 0.05);
    // light bouncing inside the slab shows as a few soft parallel lines
    side += sc * si * (exp(-pow((fs - 0.3)/0.06, 2.0))*0.18 + exp(-pow((fs - 0.72)/0.05, 2.0))*0.12) * (0.6 + 0.4*fbm(vec2(v*5.0, 2.0)));
    side *= 0.85 + 0.15*cos(v*40.0 + fs*3.0);                             // the ribs' rhythm seen through the edge
    g = mix(g, side, smoothstep(0.0, 0.08, fs));
  }
  // crisp arrises where faces meet
  float ar1 = exp(-pow((s - (1.0 - thick))*(x1 - x0)/0.0011, 2.));
  float ar2 = exp(-pow((1.0 - s)*(x1 - x0)/0.0012, 2.));
  g += sc * si * (ar1*0.35 + ar2*0.25) * (0.6 + 0.6*L);
  // the inner edge, where it meets the wall, sits in a soft contact shadow
  g *= 0.8 + 0.2*smoothstep(0.0, 0.05, s);
  return mix(col, g, inside);
}
vec3 glassCaustic(vec2 p, float xi, float xo, float bo){
  if(p.y > HY) return vec3(0.);
  float hx = uAspect*0.5;
  float s = (p.x - xi*hx) / ((xo - xi)*hx);
  if(s < 0.0 || s > 1.0) return vec3(0.);
  float yb = mix(HY, bo, s);
  float d = yb - p.y;                                   // distance below the panel's waterline
  if(d < 0.0 || d > 0.08) return vec3(0.);
  float wob = fbm(vec2(s*12.0, d*30.0 + uTime*0.15))*2.5;
  float lines = pow(abs(sin(d*160.0 + wob)), 26.0);
  return sunCol() * sunI() * lines * exp(-d*35.0) * 0.3 * (0.35 + 0.65*sin(uT*PI));
}

// ---------- transparent new-media sculpture (raymarched) ----------
mat2 rot2(float a){ float c = cos(a), s2 = sin(a); return mat2(c, -s2, s2, c); }
float smin(float a, float b, float k){ float h = clamp(0.5 + 0.5*(b - a)/k, 0., 1.); return mix(b, a, h) - k*h*(1. - h); }
float sdRoundBox(vec3 q, vec3 b, float r){ vec3 d = abs(q) - b; return length(max(d, 0.)) + min(max(d.x, max(d.y, d.z)), 0.) - r; }
float sdTorus(vec3 q, vec2 t){ vec2 d = vec2(length(q.xz) - t.x, q.y); return length(d) - t.y; }
float sdSculpt(vec3 q){
  float tt = uTime*0.11;
  q.xz = rot2(tt) * q.xz;
  vec3 a = q;
  a.xz = rot2(q.y*1.7 + sin(tt*1.3)*0.5) * a.xz;             // a slow twist up the column
  float body = sdRoundBox(a, vec3(0.24, 0.82, 0.09), 0.1);
  float orb  = length(q - vec3(0.22*sin(tt*0.8), 0.5, 0.12*cos(tt))) - 0.3;
  vec3 tq = q - vec3(0.0, -0.4, 0.0);
  tq.yz = rot2(0.95) * tq.yz; tq.xy = rot2(0.3) * tq.xy;
  float ring = sdTorus(tq, vec2(0.62, 0.035));
  float d = smin(body, orb, 0.28);
  d = smin(d, ring, 0.22);
  d += 0.022*sin(q.x*9.0 + tt*2.0)*sin(q.y*7.0 - tt)*sin(q.z*8.0);   // a living, rippling surface
  return d;
}
vec3 sculptN(vec3 q){
  vec2 e = vec2(0.002, 0.);
  return normalize(vec3(sdSculpt(q + e.xyy) - sdSculpt(q - e.xyy), sdSculpt(q + e.yxy) - sdSculpt(q - e.yxy), sdSculpt(q + e.yyx) - sdSculpt(q - e.yyx)));
}
// march a ray for screen point p; returns hit (z>0) and normal, plus soft coverage
float marchSculpt(vec2 p, out vec3 n, out vec3 rd, out float cover){
  const float SC = 0.3;
  vec2 q = (p - sculptC()) / SC;
  n = vec3(0.); cover = 0.;
  rd = normalize(vec3(q, 2.6));
  if(length(q) > 1.45) return -1.0;
  vec3 ro = vec3(0., 0., -2.6);
  float t = 1.2, minD = 1e3;
  for(int i = 0; i < 56; i++){
    vec3 pos = ro + rd*t;
    float d = sdSculpt(pos);
    minD = min(minD, d);
    if(d < 0.0015){ n = sculptN(pos); cover = 1.0; return t; }
    t += d*0.9;
    if(t > 4.2) break;
  }
  cover = 1.0 - smoothstep(0.0, 0.012, minD);       // soft anti-aliased silhouette
  return -1.0;
}
vec3 shadeSculpt(vec2 p, vec3 col, bool reflection){
  vec3 n, rd; float cover;
  float hit = marchSculpt(p, n, rd, cover);
  if(cover <= 0.0) return col;
  vec3 sc = sunCol(); float si = sunI();
  if(hit < 0.0){                                    // just outside the silhouette: a faint glow
    return col + sc*si*0.08*cover;
  }
  float cosV = abs(dot(n, rd));
  float fres = 0.04 + 0.96*pow(1.0 - cosV, 5.0);
  vec3 R = reflect(rd, n);
  vec3 Ldir = normalize(vec3(-0.6, 0.65, -0.45));
  vec3 env = mix(ambCol()*0.5, sc*1.25*si, smoothstep(-0.25, 0.75, dot(R, Ldir)));
  float spec = pow(max(dot(R, Ldir), 0.0), 70.0);
  vec3 irid = spectrum(fres*2.6 + n.y*0.6 + uTime*0.02) * fres;
  if(reflection){
    return col + (env*0.18 + irid*0.12 + sc*si*0.04) * cover + sc*si*spec*0.35;
  }
  // refraction: the room seen through the curved glass
  vec2 off = -n.xy * 0.075 * (0.6 + 0.6*(1.0 - cosV));
  vec3 refr = vec3(scene(p + off*0.92, true).r + rainbow(p + off*0.92).r,
                   scene(p + off, true).g + rainbow(p + off).g,
                   scene(p + off*1.14, true).b + rainbow(p + off*1.14).b);
  vec3 g = refr * vec3(0.95, 0.985, 1.0) + sc*si*0.025;
  g = mix(g, env, clamp(fres, 0.0, 0.9));
  g += irid * si * 0.22;
  g += sc * si * spec * 1.4;
  g += sc * si * 0.06 * pow(1.0 - cosV, 2.0);        // soft inner glow near the edges
  return mix(col, g, cover);
}
// caustic light focused onto the water beneath it
vec3 sculptCaustic(vec2 p){
  vec2 c = vec2(sculptC().x, -0.41);
  vec2 d = (p - c) * vec2(1.0, 3.2);
  float r = length(d);
  if(r > 0.3 || p.y > HY) return vec3(0.);
  float w = fbm(d*6.0 + vec2(uTime*0.1, -uTime*0.08));
  float lines = pow(abs(sin(w*9.0 + r*20.0)), 10.0);
  return sunCol() * sunI() * lines * smoothstep(0.3, 0.05, r) * 0.32 * (0.35 + 0.65*sin(uT*PI));
}

// ---------- floating transparent screen with the index ----------
const float PSC = 0.3;
const vec2 SCR_H = vec2(0.62, 0.88);            // half size in local units
float screenYaw(){ return -0.5 + 0.05*sin(uTime*0.2); }
vec2 screenC(){ return sculptC() + vec2(0.0, 0.012*sin(uTime*0.6)); }
// ray from the camera through screen point p onto the panel's plane; l: local coords, ndv: facing
float rayScreen(vec2 p, out vec2 l, out float ndv){
  vec2 q = (p - screenC()) / PSC;
  vec3 ro = vec3(0., 0., -2.6), rd = normalize(vec3(q, 2.6));
  float a = screenYaw(), b = 0.06;
  vec3 n = vec3(sin(a), 0., -cos(a));
  n = vec3(n.x, n.y*cos(b) - n.z*sin(b), n.y*sin(b) + n.z*cos(b));
  vec3 right = normalize(cross(n, vec3(0., 1., 0.)));
  vec3 up = cross(right, n);
  float den = dot(rd, n);
  if(abs(den) < 1e-4) return 0.;
  float t = dot(-ro, n) / den;
  vec3 hp = ro + rd*t;
  l = vec2(dot(hp, right), dot(hp, up));
  ndv = abs(den);
  return 1.;
}
float sdRR(vec2 l, vec2 h, float r){ vec2 d = abs(l) - h + r; return length(max(d, 0.)) + min(max(d.x, d.y), 0.) - r; }
vec3 shadeScreen(vec2 p, vec3 col, bool reflection, float fade){
  vec2 l; float ndv;
  if(rayScreen(p, l, ndv) < 0.5) return col;
  float sd = sdRR(l, SCR_H, 0.07);
  float cover = 1.0 - smoothstep(-0.008, 0.008, sd);
  if(cover <= 0.0) return col;
  vec3 sc = sunCol(); float si = sunI();
  vec2 muv = l / SCR_H * 0.5 + 0.5;
  vec3 menu = vec3(texture2D(uMenu, muv + vec2(0.0018, 0.)).r, texture2D(uMenu, muv).g, texture2D(uMenu, muv - vec2(0.0018, 0.)).b);
  float rim = exp(-pow(sd/0.0045, 2.0));
  float bezel = exp(-pow((sd + 0.02)/0.003, 2.0));
  if(reflection){
    return col + (menu*0.35 + (sc*0.6 + spectrum(l.x + l.y)*0.3)*si*rim*0.25 + sc*si*0.02) * cover * fade;
  }
  // glass: near the rim the surface bevels, bending the view more
  float bev = smoothstep(-0.07, 0.0, sd);
  vec2 off = vec2(0.012, -0.004) + normalize(l + 1e-4) * bev * 0.035;
  vec3 refr = vec3(scene(p + off*0.92, true).r + rainbow(p + off*0.92).r,
                   scene(p + off, true).g + rainbow(p + off).g,
                   scene(p + off*1.12, true).b + rainbow(p + off*1.12).b);
  vec3 g = refr * vec3(0.9, 0.96, 1.0) + vec3(0.015, 0.025, 0.035);
  float fres = 0.04 + 0.96*pow(1.0 - ndv, 5.0) + bev*0.25;
  vec3 env = mix(ambCol()*0.6, sc*si*1.1, smoothstep(-0.6, 0.8, l.y*0.6 - l.x*0.3));
  g = mix(g, env, clamp(fres, 0.0, 0.6));
  // a slow band of light sweeping across the glass
  float sweep = exp(-pow((l.x*0.7 + l.y*0.45 - (mod(uTime*0.12, 3.2) - 1.6))*3.0, 2.0));
  g += sc * si * sweep * 0.08;
  // the index, glowing, with faint scan lines
  float scan = 0.88 + 0.12*sin(l.y*420.0);
  g += menu * scan * 1.15;
  g += vec3(0.5, 0.8, 1.0) * dot(menu, vec3(0.33)) * 0.15;              // soft bloom of the text
  // edges: bright rim with a touch of spectrum, and an inner bezel line for thickness
  g += (sc*0.85 + spectrum(l.x*0.8 + l.y*0.5 + uTime*0.03)*0.35) * si * rim * 0.7;
  g += vec3(0.6, 0.85, 1.0) * bezel * 0.14;
  return mix(col, g, cover);
}

// ---------- spiral sculpture: glass screens rising around a vertical axis ----------
const float HSC = 0.3;          // screen scale
const float HR = 0.62;          // radius
const vec2 PH = vec2(0.30, 0.2); // panel half size (w, h)
vec2 helixC(){ return vec2(0.58*uAspect*0.5, -0.14); }
const float HWATER = -0.415;   // where the sculpture stands in the water
void panelFrame(float i, out vec3 c, out vec3 n, out vec3 rt){
  float a = i*0.95 + uRot;
  float y = -0.67 + i*0.27;
  c = vec3(HR*sin(a), y, -HR*cos(a));
  n = vec3(sin(a), 0., -cos(a));
  rt = vec3(cos(a), 0., sin(a));
}
vec3 panelContent(float i, vec2 luv, float hov){
  float gl = 1.0 - hov;
  float tq = floor(uTime*0.6 + i*3.1);
  float row = floor(luv.y*22.0);
  float hb = hash(vec2(row, i*7.0 + tq));
  luv.x += step(0.84, hb) * (hash(vec2(row + 2.0, i + tq)) - 0.5) * 0.22 * gl;
  float blk = step(0.93, hash(vec2(floor(luv.y*9.0), i + tq*1.3)));
  luv = mix(luv, floor(luv*vec2(28., 18.))/vec2(28., 18.), blk*gl);
  vec3 c;
  if(i > 7.5){                                     // two screens carry only signal noise
    float nz = hash(floor(luv*vec2(90., 60.)) + floor(uTime*8.0) + i);
    c = vec3(nz*0.35) + spectrum(luv.y*3.0 + uTime*0.1)*0.08*step(0.9, hash(vec2(row, tq)));
  } else {
    float ca = 0.006 + 0.01*gl*step(0.8, hb);
    vec2 cl = clamp(luv, 0.002, 0.998);
    c = vec3(tile(i, cl + vec2(ca, 0.)).r, tile(i, cl).g, tile(i, cl - vec2(ca, 0.)).b);
  }
  c *= 0.9 + 0.1*sin(luv.y*500.0);                 // scan lines
  return c;
}
vec3 shadeHelix(vec2 p, vec3 col, bool refl, float fade){
  vec2 q = (p - helixC()) / HSC;
  if(abs(q.x) > 1.4) return col;
  vec3 ro = vec3(0., 0., -2.6), rd = normalize(vec3(q, 2.6));
  float t1 = 1e3, t2 = 1e3, i1 = -1., i2 = -1.; vec2 l1 = vec2(0.), l2 = vec2(0.); float f1 = 0., f2 = 0., e1 = 0., e2 = 0.;
  for(int k = 0; k < 10; k++){
    float i = float(k);
    vec3 c, n, rt; panelFrame(i, c, n, rt);
    float den = dot(rd, n);
    if(abs(den) < 1e-3) continue;
    float t = dot(c - ro, n) / den;
    vec3 hp = ro + rd*t;
    vec2 l = vec2(dot(hp - c, rt), hp.y - c.y);
    vec2 dd = abs(l) - PH;
    float sd = max(dd.x, dd.y);
    if(sd > 0.004) continue;
    float front = den < 0.0 ? 1.0 : 0.0;
    if(t < t1){ t2 = t1; i2 = i1; l2 = l1; f2 = f1; e2 = e1; t1 = t; i1 = i; l1 = l; f1 = front; e1 = sd; }
    else if(t < t2){ t2 = t; i2 = i; l2 = l; f2 = front; e2 = sd; }
  }
  if(i1 < 0.0) return col;
  vec3 sc = sunCol(); float si = sunI();
  vec3 base = col;
  if(!refl){                                        // glass bends the room seen through it
    vec2 off = vec2(0.012, 0.004);
    base = vec3(scene(p + off*0.9, true).r, scene(p + off, true).g, scene(p + off*1.12, true).b) + rainbow(p + off);
  }
  // back screen first, seen through the front one
  if(i2 >= 0.0){
    vec2 luv = l2/PH*0.5 + 0.5; if(f2 < 0.5) luv.x = 1.0 - luv.x;
    float a = (f2 > 0.5 ? 0.55 : 0.28) * (1.0 - smoothstep(-0.006, 0.0, e2));
    base = mix(base, panelContent(i2, luv, 0.0)*0.85 + vec3(0.02,0.03,0.04), a);
    base += vec3(0.75,0.9,1.0) * exp(-pow(e2/0.004, 2.)) * 0.18;
  }
  float hov = (abs(i1 - uHoverPanel) < 0.5) ? 1.0 : 0.0;
  vec2 luv = l1/PH*0.5 + 0.5; if(f1 < 0.5) luv.x = 1.0 - luv.x;
  float a = (f1 > 0.5 ? 0.82 : 0.35) * (1.0 - smoothstep(-0.006, 0.0, e1));
  vec3 content = panelContent(i1, luv, hov) * (1.0 + 0.35*hov) + vec3(0.02,0.03,0.045);
  vec3 g = mix(base, content, a);
  float rim = exp(-pow(e1/0.0035, 2.));
  g += (vec3(0.8,0.92,1.0) + spectrum(luv.y + i1*0.2)*0.3) * rim * (0.35 + 0.4*hov) * (0.6 + 0.4*f1);
  // reflection of the light across the glass
  float sweep = exp(-pow((luv.x*0.6 + luv.y*0.5 - 0.55 - 0.3*sin(uTime*0.15 + i1))*4.0, 2.));
  g += sc * si * sweep * 0.08 * f1;
  float cov = 1.0 - smoothstep(-0.004, 0.004, e1);
  if(refl) return col + (g - col) * cov * 0.4 * fade;
  return mix(col, g, cov);
}
// spiralling lines, cables and glitch debris around the sculpture
// depth of the nearest screen under this pixel (sculpture space, smaller = closer), and how much it hides
float panelDepth(vec2 p, out float cov){
  vec2 q = (p - helixC()) / HSC;
  vec3 ro = vec3(0., 0., -2.6), rd = normalize(vec3(q, 2.6));
  float bt = 1e3, bz = 99.0; cov = 0.0;
  for(int k = 0; k < 10; k++){
    vec3 c, n, rt; panelFrame(float(k), c, n, rt);
    float den = dot(rd, n);
    if(abs(den) < 1e-3) continue;
    float t = dot(c - ro, n) / den;
    vec3 hp = ro + rd*t;
    vec2 l = vec2(dot(hp - c, rt), hp.y - c.y);
    if(abs(l.x) > PH.x || abs(l.y) > PH.y) continue;
    if(t < bt){ bt = t; bz = hp.z; cov = den < 0.0 ? 0.85 : 0.55; }
  }
  return bz;
}
// a point on a spiral at angle th, radius rr -> screen x, and its depth
float projX(float rr, float th, out float z){ z = -rr*cos(th); return helixC().x + HSC*rr*sin(th)*2.6/(2.6 + z); }

vec3 helixLines(vec2 p, bool occl){
  vec2 C = helixC();
  float ly = (p.y - C.y) / HSC;
  if(p.y < HWATER || abs(p.x - C.x) > 0.42) return vec3(0.);
  float cov = 0.0, zP = 99.0;
  if(occl) zP = panelDepth(p, cov);
  vec3 o = vec3(0.);
  for(int k = 0; k < 4; k++){
    float fk = float(k);
    float th = ly*(1.55 + fk*0.12) + fk*1.57 + uRot*(0.85 + fk*0.2);
    float rr = HR*(0.75 + 0.18*fk);
    float z3; float sx = projX(rr, th, z3);
    float hide = z3 > zP ? (1.0 - cov) : 1.0;                       // behind a screen: only faintly through the glass
    float w = 0.0011 * (z3 < 0.0 ? 1.0 : 0.6);
    o += vec3(0.86,0.93,1.0) * exp(-pow((p.x - sx)/w, 2.)) * (z3 < 0.0 ? 0.45 : 0.16) * hide;
    // irregular trails: little spirals of their own, at different radii (in front of or behind the main line)
    for(int m = 0; m < 3; m++){
      float fm = float(m);
      float hs = hash(vec2(fk*3.0 + fm, 1.9));
      float drift = 0.9*noise(vec2(uTime*0.35 + fm*4.0, fk*2.0));
      float g = ly*(1.8 + 1.4*hs) - uTime*(0.6 + 0.9*hs) - drift - fm*0.37 - fk*0.53;
      float cell = floor(g), fr = fract(g);
      float h = hash(vec2(cell, fk*7.0 + fm*13.0));
      if(h < 0.45) continue;
      float len = 0.12 + 0.35*hash(vec2(cell, fm + 21.0));
      float start = 0.6*hash(vec2(cell, fm + 5.0));
      float u = (fr - start) / len;
      if(u < 0.0 || u > 1.0) continue;
      float env = smoothstep(0.0, 0.18, u) * smoothstep(1.0, 0.45, u) * (0.4 + 0.6*h);
      float dist = hash(vec2(cell, fm + 31.0));
      float freq = 6.0 + 8.0*hash(vec2(cell, fm + 2.0));
      float wrapPh = ly*freq - uTime*(2.0 + 2.5*hs) + h*6.28;
      float rr2 = rr*(0.6 + 0.8*dist) + 0.015*sin(wrapPh);            // its own radius: inside or outside the main line
      float th2 = th + 0.06*cos(wrapPh) + (dist - 0.5)*0.4;
      float z4; float sx2 = projX(rr2, th2, z4);
      float hide2 = z4 > zP ? (1.0 - cov) : 1.0;
      float nearF = clamp(0.55 - z4*0.6, 0.2, 1.2);                   // closer to us: brighter, thicker
      o += vec3(0.95,0.97,1.0) * exp(-pow((p.x - sx2)/(0.0007 + 0.0009*nearF), 2.)) * env * nearF * 0.6 * hide2;
    }
  }
  // the axis: two thin cables, hidden behind screens that sit in front of the axis
  float hideA = 0.0 > zP ? (1.0 - cov) : 1.0;
  o += vec3(0.8,0.9,1.0) * (exp(-pow((p.x - C.x + 0.004)/0.0008, 2.)) + exp(-pow((p.x - C.x - 0.006)/0.0008, 2.))) * 0.12 * hideA;
  // dust rising slowly around the sculpture, brighter where the light reaches it
  for(int d = 0; d < 2; d++){
    float fd = float(d);
    float sc2 = 70.0 + 50.0*fd;
    vec2 gp = vec2((p.x - C.x)*sc2 + sin(p.y*6.0 + uTime*0.4 + fd)*0.8, (p.y - uTime*(0.018 + 0.012*fd))*sc2);
    vec2 cl = floor(gp), f = fract(gp);
    float hh = hash(cl + fd*17.0);
    if(hh > 0.86){
      vec2 pos = vec2(hash(cl + 3.3), hash(cl + 6.6));
      float r = length(f - pos);
      float size = 0.06 + 0.1*hash(cl + 9.9);
      float tw = 0.6 + 0.4*sin(uTime*1.7 + hh*40.0);
      float fadeX = 1.0 - smoothstep(0.18, 0.4, abs(p.x - C.x));
      o += sunCol() * smoothstep(size, 0.0, r) * tw * fadeX * (0.5 + 0.7*sunI()) * (0.6 + 0.4*fd);
    }
  }
  return o;
}

// ---------- long-exposure light: silky ribbons and smeared streaks ----------
vec3 lightRibbons(vec2 p){
  if(p.y < HY) return vec3(0.);
  vec3 sc = sunCol(); float si = sunI();
  // where the ribbons live: around the window light, drifting
  vec2 c = uC + vec2(-0.12 + 0.05*sin(uTime*0.07), -0.02);

function upload(unit, source, repeat) {

function renderWallText(i, target) {
  const w = WORKS[i];

  const junk = Array.from("█▓▒░▚▞▖▗▘▝0123456789ABCDEF#%&/|_:<>");

    ctx.clearRect(0, 0, Wd, Hd);

      const bh = Math.max(2, Math.floor(2 + R() * 26 * (0.3 + chaos)));

addEventListener("resize", () => { resize(); drawWallText(textIdx); }); resize();

// ---------- state ----------
let tTarget = 0, t = 0;
let mouse = [0.5, 0.5], mouseT = [0.5, 0.5];
let hover = 0, hoverT = 0, textSwapping = false;
const clicks = [];
const start = performance.now();
const now = () => (performance.now() - start) / 1000;

// one wheel gesture = one work
let idxTarget = 0, lockUntil = 0, wheelAcc = 0, lastWheel = 0, gestureUsed = false;
let lastAct = performance.now();
function go(i) {
  lastAct = performance.now();
  idxTarget = Math.max(0, Math.min(N - 1, i));
  tTarget = idxTarget / (N - 1);
}
function step(dir) {
  const tn = performance.now();
  if (tn < lockUntil) return;
  lockUntil = tn + 350;
  go(idxTarget + dir);
}
addEventListener("wheel", e => {
  e.preventDefault();
  if ($("veil").classList.contains("open")) return;
  const tn = performance.now();
  if (tn - lastWheel > 200) { wheelAcc = 0; gestureUsed = false; } // new gesture
  lastWheel = tn;
  if (gestureUsed) return; // ignore trackpad inertia from the same swipe
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) > 20 && tn >= lockUntil) { gestureUsed = true; step(Math.sign(wheelAcc)); wheelAcc = 0; }
}, { passive: false });
addEventListener("keydown", e => {
  if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) step(1);
  if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) step(-1);
});
let touchY = null;
addEventListener("touchstart", e => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", e => {
  if (touchY === null) return;
  const dy = touchY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 40) step(Math.sign(dy));
  touchY = null;
}, { passive: true });

function patch(t) {
  const s = Math.sin(Math.PI * t);
  return {
    // morning on the far left, night ends where dusk used to be, evenly spaced in between
    c: [(0.4125 * t - 0.341) * 0.72 * Math.min(aspect, 1.8) - 0.1, 0.1 - 0.06 * s],
    k: 0.8 - 1.05 * t,
    wh: [0.36, 0.48 - 0.06 * s],
  };
}
function toP(cx, cy) { return [(cx / innerWidth - 0.5) * aspect, (1 - cy / innerHeight) - 0.5]; }
function inPatch(q) {
  const P = patch(t);
  let dx = q[0] - P.c[0], dy = q[1] - P.c[1];
  dx -= P.k * dy;
  return Math.abs(dx) < P.wh[0] / 2 && Math.abs(dy) < P.wh[1] / 2;
}
addEventListener("pointermove", e => {
  mouseT = [e.clientX / innerWidth, 1 - e.clientY / innerHeight];
  const qq = toP(e.clientX, e.clientY);
  if (lastMX !== null) spin += (e.clientX - lastMX) / innerWidth * 0.9;   // moving the mouse pushes the spin
  lastMX = e.clientX;
  spin = Math.max(-1.2, Math.min(1.2, spin));
  hoverPanel = panelAt(qq);
  if (hoverPanel > 7) hoverPanel = -1;
  const over = hoverPanel < 0 && inPatch(qq);
  hoverT = over ? 1 : 0;
  canvas.style.cursor = (over || hoverPanel >= 0) ? "pointer" : "default";
});
canvas.addEventListener("click", e => {
  const q = toP(e.clientX, e.clientY);
  const pi = panelAt(q);
  if (pi >= 0 && pi < 8) { lastAct = performance.now(); openWork(pi); return; }
  if (inPatch(q)) { openWork(currentIndex()); return; }
  clicks.push([q[0], q[1], now(), 1]);
  if (clicks.length > 4) clicks.shift();
});

// ---------- floating screen: index menu ----------
const menuCanvas = document.createElement("canvas");
menuCanvas.width = 512; menuCanvas.height = 720;
let menuTex = null, menuHover = -1, menuDrawn = "";
const ITEM_Y0 = 172, ITEM_H = 50, FOOT_Y = 610;
function drawMenu(hi, cur) {
  const key = hi + "/" + cur;
  if (key === menuDrawn) return;
  menuDrawn = key;
  const x = menuCanvas.getContext("2d");
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalCompositeOperation = "source-over";
  x.fillStyle = "#000"; x.fillRect(0, 0, 512, 720);
  const mono = (w, sz) => `${w} ${sz}px 'JetBrains Mono', monospace`;
  x.textBaseline = "alphabetic";
  x.fillStyle = "rgba(190,230,255,0.6)"; x.font = mono(400, 13);
  x.textAlign = "left"; x.fillText("INDEX / 0" + N, 40, 74);
  x.textAlign = "right"; x.fillText("LIGHT ROOM", 472, 74);
  x.fillStyle = "rgba(190,230,255,0.28)"; x.fillRect(40, 92, 432, 1);
  for (let k = 0; k <= 12; k++) x.fillRect(40 + k * 36, 88, 1, k % 4 ? 3 : 6);
  WORKS.forEach((w, i) => {
    const y = ITEM_Y0 + i * ITEM_H, on = i === hi, isCur = i === cur;
    if (on) {
      x.fillStyle = "rgba(150,215,255,0.14)"; x.fillRect(28, y - 32, 456, 44);
      x.fillStyle = "rgba(220,245,255,0.95)"; x.fillRect(28, y - 32, 2, 44);
    }
    x.textAlign = "left";
    x.font = mono(400, 12); x.fillStyle = on ? "rgba(230,248,255,0.95)" : "rgba(190,230,255,0.45)";
    x.fillText(String(i + 1).padStart(2, "0"), 44, y);
    x.font = `300 ${on ? 28 : 26}px 'Cormorant Garamond', serif`;
    if (on) {
      x.globalCompositeOperation = "lighter";
      x.fillStyle = "rgba(255,80,90,0.55)"; x.fillText(w.title, 84, y);
      x.fillStyle = "rgba(80,220,255,0.55)"; x.fillText(w.title, 87, y);
      x.globalCompositeOperation = "source-over";
    }
    x.fillStyle = on ? "rgba(255,255,255,1)" : "rgba(225,240,250,0.62)";
    x.fillText(w.title, 85.5, y);
    x.textAlign = "right"; x.font = mono(400, 11);
    x.fillStyle = on ? "rgba(230,248,255,0.9)" : "rgba(190,230,255,0.4)";
    x.fillText(w.meta.toUpperCase(), 472, y);
    if (isCur) { x.fillStyle = "rgba(240,250,255,0.95)"; x.beginPath(); x.arc(34, y - 5, 2.5, 0, Math.PI * 2); x.fill(); }
  });
  x.textAlign = "left";
  x.fillStyle = "rgba(190,230,255,0.28)"; x.fillRect(40, FOOT_Y - 26, 432, 1);
  const fi = hi >= 100 ? hi - 100 : -1;
  x.font = mono(400, 13);
  ["ABOUT", "CONTACT"].forEach((t, k) => {
    x.fillStyle = fi === k ? "rgba(255,255,255,1)" : "rgba(200,235,255,0.6)";
    x.fillText(t, 44 + k * 120, FOOT_Y + 8);
    if (fi === k) { x.fillStyle = "rgba(220,245,255,0.9)"; x.fillRect(44 + k * 120, FOOT_Y + 14, x.measureText(t).width, 1); }
  });
  x.font = mono(400, 10); x.fillStyle = "rgba(190,230,255,0.35)"; x.textAlign = "right";
  x.fillText("34.41°N  119.85°W", 472, FOOT_Y + 8);
  if (!menuTex) menuTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, menuTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, menuCanvas);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U.uMenu, 2);
  gl.activeTexture(gl.TEXTURE0);
}
// same geometry as the shader's rayScreen: returns the menu-canvas pixel under a screen point, or null
function screenHit(q) {
  const tn = now();
  const cx = 0.58 * aspect * 0.5, cy = -0.03 + 0.012 * Math.sin(tn * 0.6);
  const qx = (q[0] - cx) / 0.3, qy = (q[1] - cy) / 0.3;
  const len = Math.hypot(qx, qy, 2.6), rd = [qx / len, qy / len, 2.6 / len], ro = [0, 0, -2.6];
  const a = -0.5 + 0.05 * Math.sin(tn * 0.2), b = 0.06;
  let n = [Math.sin(a), 0, -Math.cos(a)];
  n = [n[0], n[1] * Math.cos(b) - n[2] * Math.sin(b), n[1] * Math.sin(b) + n[2] * Math.cos(b)];
  const cross = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
  const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
  let right = cross(n, [0, 1, 0]); const rl = Math.hypot(...right); right = right.map(v => v / rl);
  const up = cross(right, n);
  const den = dot(rd, n); if (Math.abs(den) < 1e-4) return null;
  const t = dot(ro.map(v => -v), n) / den;
  const hp = ro.map((v, i) => v + rd[i] * t);
  const lx = dot(hp, right), ly = dot(hp, up);
  if (Math.abs(lx) > 0.62 || Math.abs(ly) > 0.88) return null;
  return [(lx / 0.62 * 0.5 + 0.5) * 512, (1 - (ly / 0.88 * 0.5 + 0.5)) * 720];
}
function menuItemAt(q) {
  const h = screenHit(q); if (!h) return -2;          // -2: not on the screen
  const [mx, my] = h;
  for (let i = 0; i < N; i++) { const y = ITEM_Y0 + i * ITEM_H; if (my > y - 34 && my < y + 14 && mx > 24 && mx < 488) return i; }
  if (my > FOOT_Y - 14 && my < FOOT_Y + 18) { if (mx > 40 && mx < 110) return 100; if (mx > 160 && mx < 250) return 101; }
  return -1;                                          // on the glass, not on an item
}

// ---------- sculpture panels: hover + click ----------
let hoverPanel = -1, rot = 0, spin = 0, lastMX = null;
function panelAt(q) {
  const tn = now();
  const cx = 0.58 * aspect * 0.5, cy = -0.14;
  const qx = (q[0] - cx) / 0.3, qy = (q[1] - cy) / 0.3;
  if (Math.abs(qx) > 1.4) return -1;
  const L = Math.hypot(qx, qy, 2.6), rd = [qx / L, qy / L, 2.6 / L];
  let best = -1, bt = 1e9;
  for (let i = 0; i < 10; i++) {
    const a = i * 0.95 + rot, y = -0.67 + i * 0.27;
    const c = [0.62 * Math.sin(a), y, -0.62 * Math.cos(a)], n = [Math.sin(a), 0, -Math.cos(a)], rt = [Math.cos(a), 0, Math.sin(a)];
    const den = rd[0] * n[0] + rd[2] * n[2];
    if (Math.abs(den) < 1e-3) continue;
    const t = (c[0] * n[0] + (c[2] + 2.6) * n[2]) / den;
    const hp = [rd[0] * t, rd[1] * t, -2.6 + rd[2] * t];
    const lu = (hp[0] - c[0]) * rt[0] + (hp[2] - c[2]) * rt[2], lv = hp[1] - c[1];
    if (Math.abs(lu) < 0.3 && Math.abs(lv) < 0.2 && t < bt) { bt = t; best = i; }
  }
  return best;
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const rail = $("rail");
WORKS.forEach((w, i) => {
  const b = document.createElement("button");
  b.title = w.title;
  b.onclick = () => go(i);
  rail.appendChild(b);
});
function currentIndex() { return idxTarget; }
let lastIdx = -1;
function updateUI() {
  const idx = currentIndex();
  if (idx === lastIdx) return;
  lastIdx = idx;
  $("wtitle").textContent = WORKS[idx].title;
  $("wmeta").textContent = WORKS[idx].meta;
  [...rail.children].forEach((b, i) => b.classList.toggle("on", i === idx));
}
function openWork(i) {
  const w = WORKS[i];
  $("pimg").src = tileURLs[i];
  $("ptitle").textContent = w.title;
  $("pmeta").textContent = w.meta;
  $("pdesc").textContent = w.desc;
  $("veil").classList.add("open");
}
const closeWork = () => $("veil").classList.remove("open");
$("close").onclick = closeWork;
$("home").addEventListener("click", e => { e.preventDefault(); closeWork(); go(0); });
$("veil").addEventListener("click", closeWork);
addEventListener("keydown", e => { if (e.key === "Escape") closeWork(); });

// ---------- loop ----------
const clickArr = new Float32Array(16);
function frame() {
  t += (tTarget - t) * 0.055;
  mouse[0] += (mouseT[0] - mouse[0]) * 0.05;
  mouse[1] += (mouseT[1] - mouse[1]) * 0.05;
  hover += (hoverT - hover) * 0.08;
  const P = patch(t);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform1f(U.uTime, now());
  gl.uniform1f(U.uT, t);
  gl.uniform1f(U.uAspect, aspect);
  gl.uniform1f(U.uHover, hover);
  gl.uniform1f(U.uN, N);
  gl.uniform2f(U.uMouse, mouse[0], mouse[1]);
  gl.uniform2f(U.uC, P.c[0], P.c[1]);
  gl.uniform1f(U.uK, P.k);
  gl.uniform2f(U.uWH, P.wh[0], P.wh[1]);
  clickArr.fill(0);
  clicks.forEach((c, i) => clickArr.set(c, i * 4));
  gl.uniform4fv(U.uClicks, clickArr);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const want = currentIndex();
  if (want !== textIdx && !textSwapping) { textIdx = want; glitchTextTo(textIdx); }
  // idle for 5 s: move on to the next work by itself (loops back to the first)
  if (performance.now() - lastAct > 5000 && !$("veil").classList.contains("open")) go((idxTarget + 1) % N);
  spin *= 0.965;                                       // eases back to a slow drift
  rot += (0.0012 + spin * 0.05);
  gl.uniform1f(U.uRot, rot);
  gl.uniform1f(U.uHoverPanel, hoverPanel);
  updateUI();
  requestAnimationFrame(frame);
}
t = tTarget;
frame();
</script>
